<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<!-- Bản deploy trên nooi.net: URL là /gallery (không có dấu / cuối) nên phải
     khai báo base để mọi đường dẫn tương đối (styles.css, app.js, data/, images/)
     trỏ đúng về /gallery/. Thẻ này do scripts/sync-gallery.sh tự thêm vào bản
     trong public/gallery — bản gốc ở vault KHÔNG có, nhờ vậy vẫn nhấp đúp
     index.html để chạy độc lập được. -->
<base href="/gallery/" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thư viện ảnh NOOI</title>
<meta name="description" content="Thư viện ảnh NOOI — bộ sưu tập tác phẩm thiết kế." />
<link rel="stylesheet" href="assets/fonts/geist.css" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
</head>
<body>

<!-- Đầu trang CHUẨN của nooi.net — chép đúng thanh đầu trang đang dùng ở trang chủ
     và kho video: logo · menu đủ 6 mục · Đăng nhập · Bắt đầu ngay.
     Số liệu thư viện ("1.738 ảnh · 16 board") KHÔNG để ở đây nữa — đã có dòng
     "Đang hiện …" ngay dưới thanh công cụ và số ảnh ở chân trang. -->
<header class="topbar" id="topbar">
  <div class="topbar__inner">
    <!-- Logo góc trên trái là link về trang chủ nooi.net. Dùng ĐÚNG tệp logo của
         website (/brand/nooi-horizontal-white.png) để không lệch nét với các trang khác. -->
    <a class="brand" href="/" title="Về trang chủ nooi.net" aria-label="Về trang chủ NOOI">
      <!-- Tiêu đề cấp 1 chỉ để máy đọc — phần nhìn đã là logo, nên ảnh để
           aria-hidden để trình đọc màn hình không đọc tên thương hiệu hai lần. -->
      <h1 class="sr-only" id="brandTitle">NOOI</h1>
      <img class="brand__logo" src="/brand/nooi-horizontal-white.png"
           alt="" width="74" height="34" aria-hidden="true" />
    </a>

    <nav class="menu" aria-label="Menu chính">
      <a href="/#features">Tính năng</a>
      <a href="/#tech">Công nghệ</a>
      <a href="/gallery" class="is-here" aria-current="page">Thư viện ảnh</a>
      <a href="/video">Kho video</a>
      <a href="/#about">Giới thiệu</a>
      <a href="/#contact">Liên hệ</a>
    </nav>

    <div class="topbar__actions">
      <a class="vao" href="/login">Đăng nhập</a>
      <a class="bat-dau" href="/signup">Bắt đầu ngay</a>
      <button type="button" class="nut-menu" id="menuToggle"
              aria-expanded="false" aria-controls="menuMobile" aria-label="Mở menu">
        <svg class="ico-mo" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        <svg class="ico-dong" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <!-- Menu xổ xuống trên điện thoại (màn hình ≥ 769px thì ẩn, dùng menu ngang). -->
  <div class="menu-mobile" id="menuMobile" hidden>
    <nav aria-label="Menu chính trên điện thoại">
      <a href="/#features">Tính năng</a>
      <a href="/#tech">Công nghệ</a>
      <a href="/gallery" class="is-here" aria-current="page">Thư viện ảnh</a>
      <a href="/video">Kho video</a>
      <a href="/#about">Giới thiệu</a>
      <a href="/#contact">Liên hệ</a>
    </nav>
    <div class="menu-mobile__nut">
      <a class="vao" href="/login">Đăng nhập</a>
      <a class="bat-dau" href="/signup">Bắt đầu ngay</a>
    </div>
  </div>
</header>

<!-- Thanh công cụ là NỘI DUNG trang, nằm ngoài <header> — đúng như kho video:
     đầu trang đứng yên khi cuộn, còn thanh tìm/lọc trôi theo trang. -->
<nav class="filters" id="filters" aria-label="Tìm, lọc và sắp xếp ảnh">
  <div class="filters__inner">
    <!-- Thanh công cụ một hàng, cùng dáng với kho video nooi.net/video:
         ô tìm · chọn sắp xếp · nút Lọc (kèm bộ đếm) · nút chia sẻ.
         Màn hình hẹp thì các nút tự xuống hàng, ô tìm chiếm trọn hàng đầu. -->
    <div class="bar">
      <label class="bar__search">
        <svg class="bar__ico" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Tìm theo tên board… (gõ không dấu cũng ra)" aria-label="Tìm ảnh" />
      </label>

      <label class="bar__select" title="Sắp xếp">
        <svg class="bar__ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M6 12h12M9.5 17h5"/></svg>
        <select id="sort" aria-label="Sắp xếp ảnh">
          <option value="mac-dinh">Mặc định</option>
          <option value="ngau-nhien">Ngẫu nhiên</option>
          <option value="ten-a-z">Tên board A → Z</option>
          <option value="ngang-truoc">Ảnh ngang trước</option>
          <option value="doc-truoc">Ảnh dọc trước</option>
        </select>
      </label>

      <button type="button" class="bar__btn" id="filterToggle" aria-expanded="false" aria-controls="filterPanel">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
        Lọc
        <span class="bar__n" id="filterN" hidden>0</span>
      </button>

      <button type="button" class="bar__icon" id="shareBtn"
              title="Chia sẻ danh sách đang xem" aria-label="Chia sẻ danh sách đang xem">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      </button>
    </div>

    <!-- Bảng lọc: chỉ mở khi bấm nút Lọc, để thanh trên đầu luôn gọn. -->
    <div class="bar__panel" id="filterPanel" hidden>
      <!-- Số board có thể lên tới hàng chục. Nếu để chip xuống dòng thì thanh lọc
           (dính trên đầu trang) sẽ cao dần theo số board -> cho cuộn ngang thay vì xuống dòng. -->
      <div class="filters__scroll" id="boardScroll" hidden>
        <div class="filters__group" id="boardGroup" role="group" aria-label="Board"></div>
      </div>

      <div class="bar__row">
        <!-- Khổ ảnh: dùng hình vẽ thay chữ "Dọc"/"Ngang" cho gọn mắt.
             Tên đầy đủ vẫn còn ở title/aria-label nên đọc màn hình và rê chuột vẫn rõ. -->
        <div class="filters__group" role="group" aria-label="Khổ ảnh">
          <button class="chip is-active" data-orient="all" title="Mọi khổ ảnh" aria-label="Mọi khổ ảnh">Mọi khổ</button>
          <button class="chip chip--ico" data-orient="ngang" title="Ảnh ngang" aria-label="Ảnh ngang">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/></svg>
          </button>
          <button class="chip chip--ico" data-orient="doc" title="Ảnh dọc" aria-label="Ảnh dọc">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/></svg>
          </button>
          <button class="chip chip--ico" data-orient="vuong" title="Ảnh vuông" aria-label="Ảnh vuông">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          </button>
        </div>

        <div class="filters__sep" id="boardSep" aria-hidden="true"></div>

        <div class="filters__group" role="group" aria-label="Tông màu">
          <button class="swatch is-active" data-color="all" title="Mọi tông màu" aria-label="Mọi tông màu">
            <span class="swatch__dot swatch__dot--all"></span>
          </button>
          <button class="swatch" data-color="am" title="Tông ấm" aria-label="Tông ấm">
            <span class="swatch__dot" style="background:#c98a4b"></span>
          </button>
          <button class="swatch" data-color="la" title="Tông xanh lá" aria-label="Tông xanh lá">
            <span class="swatch__dot" style="background:#6b8f5e"></span>
          </button>
          <button class="swatch" data-color="duong" title="Tông xanh dương" aria-label="Tông xanh dương">
            <span class="swatch__dot" style="background:#5b7fa6"></span>
          </button>
          <button class="swatch" data-color="trungtinh" title="Tông trung tính / tối" aria-label="Tông trung tính hoặc tối">
            <span class="swatch__dot" style="background:#8c8880"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Dòng trạng thái luôn hiện, giống "Đang hiện X/Y bài" bên kho video. -->
    <div class="filters__status">
      <span class="filters__count" id="filterCount"></span>
      <button type="button" class="bar__clear" id="clearFilters" hidden>Xoá lọc</button>
    </div>
  </div>
</nav>

<main class="stage">
  <div class="grid" id="grid" aria-live="polite"></div>
  <div class="empty" id="empty" hidden>
    <p id="emptyMsg">Chưa có ảnh nào.</p>
    <p class="empty__hint" id="emptyHint">Chạy <code>node scripts/scrape.mjs &amp;&amp; node scripts/download.mjs</code> để nạp thư viện.</p>
  </div>
</main>

<footer class="footer">
  <img class="footer__logo footer__logo--onlight" src="assets/nooi-logo.png"
       alt="NOOI — Kết nối chuyển mình" width="132" height="66" />
  <img class="footer__logo footer__logo--ondark" src="assets/nooi-logo-white.png"
       alt="" width="132" height="66" aria-hidden="true" />
  <span id="footerMeta"></span>
</footer>

<!-- Lightbox -->
<div class="lb" id="lb" hidden>
  <div class="lb__backdrop" data-close></div>

  <button class="lb__nav lb__nav--prev" id="lbPrev" aria-label="Ảnh trước">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button class="lb__nav lb__nav--next" id="lbNext" aria-label="Ảnh sau">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>

  <figure class="lb__stage">
    <img class="lb__img" id="lbImg" alt="" />
  </figure>

  <div class="lb__bar">
    <span class="lb__counter" id="lbCounter"></span>
    <div class="lb__tools">
      <button class="btn btn--icon btn--sm" id="lbClose" aria-label="Đóng">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="data/gallery.js"></script>
<script src="app.js"></script>
</body>
</html>
